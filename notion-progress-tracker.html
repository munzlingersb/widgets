<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracking · entrega em 7 dias</title>
<style>
  :root {
    --step: 1;
    --accent: oklch(20% 0.005 270);
    --muted: oklch(92% 0.005 270);
    --text: oklch(20% 0.005 270);
    --text-muted: oklch(60% 0.01 270);
    --dot-bg: oklch(99% 0.002 270);
    --halo: oklch(20% 0.005 270 / 0.07);
    --active: oklch(62% 0.18 148);
    --active-soft: oklch(62% 0.18 148 / 0.45);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --accent: oklch(96% 0.005 270);
      --muted: oklch(28% 0.008 270);
      --text: oklch(96% 0.005 270);
      --text-muted: oklch(55% 0.012 270);
      --dot-bg: transparent;
      --halo: oklch(96% 0.005 270 / 0.08);
      --active: oklch(72% 0.17 148);
      --active-soft: oklch(72% 0.17 148 / 0.55);
    }
  }

  :root[data-theme="light"] {
    --accent: oklch(20% 0.005 270);
    --muted: oklch(92% 0.005 270);
    --text: oklch(20% 0.005 270);
    --text-muted: oklch(60% 0.01 270);
    --dot-bg: oklch(99% 0.002 270);
    --halo: oklch(20% 0.005 270 / 0.07);
    --active: oklch(62% 0.18 148);
    --active-soft: oklch(62% 0.18 148 / 0.45);
  }

  :root[data-theme="dark"] {
    --accent: oklch(96% 0.005 270);
    --muted: oklch(28% 0.008 270);
    --text: oklch(96% 0.005 270);
    --text-muted: oklch(55% 0.012 270);
    --dot-bg: transparent;
    --halo: oklch(96% 0.005 270 / 0.08);
    --active: oklch(72% 0.17 148);
    --active-soft: oklch(72% 0.17 148 / 0.55);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: transparent;
  }

  body {
    padding: 18px 24px 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .tracker { max-width: 720px; margin: 0 auto; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 18px;
  }

  .title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text);
  }

  .meta {
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .meta-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--active);
    box-shadow: 0 0 0 0 var(--active-soft);
    animation: meta-pulse 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  @keyframes meta-pulse {
    0%   { box-shadow: 0 0 0 0 var(--active-soft); }
    70%  { box-shadow: 0 0 0 5px oklch(72% 0.17 148 / 0); }
    100% { box-shadow: 0 0 0 0 oklch(72% 0.17 148 / 0); }
  }

  .rail {
    position: relative;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
  }

  .line-bg, .line-fill {
    position: absolute;
    top: 12px;
    height: 2px;
    border-radius: 999px;
  }

  .line-bg {
    left: 10%;
    right: 10%;
    background: var(--muted);
  }

  .line-fill {
    left: 10%;
    background: var(--accent);
    width: calc((var(--step) - 1) / 4 * 80%);
    transition: width 500ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .step {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    z-index: 1;
  }

  .dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: oklch(98% 0.005 270);
    border: 1.5px solid var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: oklch(55% 0.012 270);
    transition: border-color 300ms ease, color 300ms ease, background 300ms ease;
  }

  .step[data-state="done"] .dot {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--dot-bg);
  }

  @media (prefers-color-scheme: dark) {
    .step[data-state="done"] .dot { color: oklch(20% 0.005 270); }
  }
  :root[data-theme="dark"] .step[data-state="done"] .dot { color: oklch(20% 0.005 270); }
  :root[data-theme="light"] .step[data-state="done"] .dot { color: oklch(99% 0.002 270); }

  .step[data-state="active"] .dot {
    background: var(--active);
    border-color: var(--active);
    color: oklch(99% 0.002 270);
    animation: dot-pulse 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  @keyframes dot-pulse {
    0%   { box-shadow: 0 0 0 0 var(--active-soft); }
    70%  { box-shadow: 0 0 0 11px oklch(72% 0.17 148 / 0); }
    100% { box-shadow: 0 0 0 0 oklch(72% 0.17 148 / 0); }
  }

  .label {
    font-size: 11px;
    font-weight: 500;
    text-align: center;
    color: var(--text-muted);
    line-height: 1.35;
    max-width: 130px;
    letter-spacing: 0.005em;
  }

  .step[data-state="done"] .label,
  .step[data-state="active"] .label {
    color: var(--text);
  }

  .step[data-state="active"] .label {
    color: var(--active);
    font-weight: 600;
  }

  .date {
    font-size: 10px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }

  @media (max-width: 520px) {
    body { padding: 16px 14px 12px; }
    .label { font-size: 10px; max-width: 70px; }
    .date { font-size: 9px; }
    .header { margin-bottom: 14px; }
  }
</style>
</head>
<body>
  <div class="tracker">
    <div class="header">
      <span class="title">Tracking : entrega em 7 dias</span>
      <span class="meta" id="meta">
        <span class="meta-dot" aria-hidden="true"></span>
        <span id="meta-text">1/5 · em andamento</span>
      </span>
    </div>

    <div class="rail">
      <div class="line-bg"></div>
      <div class="line-fill"></div>

      <div class="step"><div class="dot">1</div><div class="label">Diagnóstico</div><div class="date">04/05</div></div>
      <div class="step"><div class="dot">2</div><div class="label">Montar server, tags e snippets</div></div>
      <div class="step"><div class="dot">3</div><div class="label">Validação e testes</div><div class="date">08/05</div></div>
      <div class="step"><div class="dot">4</div><div class="label">Dashboard</div></div>
      <div class="step"><div class="dot">5</div><div class="label">Entrega</div><div class="date">10/05</div></div>
    </div>
  </div>

  <script>
    // Theme: ?theme=dark | ?theme=light | (default: auto via prefers-color-scheme)
    const params = new URLSearchParams(location.search);
    const theme = params.get("theme");
    if (theme === "dark" || theme === "light") {
      document.documentElement.dataset.theme = theme;
    }

    // Step: ?step=N na URL OU edita const STEP abaixo
    const STEP = Number(params.get("step")) || 3;

    const steps = document.querySelectorAll(".step");
    steps.forEach((el, i) => {
      const idx = i + 1;
      el.dataset.state = idx < STEP ? "done" : idx === STEP ? "active" : "pending";
    });
    document.documentElement.style.setProperty("--step", STEP);
    document.getElementById("meta-text").textContent =
      STEP >= 5 ? "5/5 · entregue" : `${STEP}/5 · em andamento`;

    // Esconde o ponto verde do header quando entregue
    if (STEP >= 5) {
      document.querySelector(".meta-dot").style.display = "none";
    }
  </script>
</body>
</html>
