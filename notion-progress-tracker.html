<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracking · entrega em 7 dias</title>
<style>
  :root {
    --step: 1;
    --accent: #18181b;
    --muted: #e4e4e7;
    --text: #18181b;
    --text-muted: #a1a1aa;
    --bg: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
  }

  body {
    padding: 36px 28px 28px;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .tracker { max-width: 720px; margin: 0 auto; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 32px;
  }

  .title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text);
  }

  .meta {
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .rail {
    position: relative;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
  }

  .line-bg, .line-fill {
    position: absolute;
    top: 13px;
    height: 2px;
    border-radius: 999px;
  }

  .line-bg {
    left: 10%;
    right: 10%;
    background: var(--muted);
  }

  .line-fill {
    left: 10%;
    background: var(--accent);
    width: calc((var(--step) - 1) / 4 * 80%);
    transition: width 500ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .step {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    z-index: 1;
  }

  .dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    transition: all 300ms ease;
  }

  .step[data-state="done"] .dot {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .step[data-state="active"] .dot {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 0 5px rgba(24, 24, 27, 0.07);
  }

  .label {
    font-size: 11px;
    font-weight: 500;
    text-align: center;
    color: var(--text-muted);
    line-height: 1.4;
    max-width: 110px;
    letter-spacing: 0.005em;
  }

  .step[data-state="done"] .label,
  .step[data-state="active"] .label {
    color: var(--text);
  }

  .date {
    font-size: 10px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  @media (max-width: 520px) {
    body { padding: 28px 16px 20px; }
    .label { font-size: 10px; max-width: 70px; }
    .date { font-size: 9px; }
    .header { margin-bottom: 24px; }
  }
</style>
</head>
<body>
  <div class="tracker">
    <div class="header">
      <span class="title">Tracking — entrega em 7 dias</span>
      <span class="meta" id="meta">1/5 · em andamento</span>
    </div>

    <div class="rail">
      <div class="line-bg"></div>
      <div class="line-fill"></div>

      <div class="step"><div class="dot">1</div><div class="label">Diagnóstico</div><div class="date">seg–ter</div></div>
      <div class="step"><div class="dot">2</div><div class="label">Tags &amp; snippets</div><div class="date">qua</div></div>
      <div class="step"><div class="dot">3</div><div class="label">Testar &amp; validar</div><div class="date">qui–sex</div></div>
      <div class="step"><div class="dot">4</div><div class="label">Dashboard</div><div class="date">sáb</div></div>
      <div class="step"><div class="dot">5</div><div class="label">Entrega</div><div class="date">dom</div></div>
    </div>
  </div>

  <script>
    // ⬇️ Pra atualizar o progresso, troque só esse número (1 a 5):
    const STEP = 1;

    const steps = document.querySelectorAll(".step");
    steps.forEach((el, i) => {
      const idx = i + 1;
      el.dataset.state = idx < STEP ? "done" : idx === STEP ? "active" : "pending";
    });
    document.documentElement.style.setProperty("--step", STEP);
    document.getElementById("meta").textContent =
      STEP >= 5 ? "5/5 · entregue" : `${STEP}/5 · em andamento`;
  </script>
</body>
</html>
